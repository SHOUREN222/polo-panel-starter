server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Caddy always terminates TLS in front of this (see
    # ops/Caddyfile.multitenant.snippet) and this app is never exposed
    # directly on :80, so it's safe to assert HSTS unconditionally here.
    # CSP intentionally keeps 'unsafe-inline'/'unsafe-eval' — Livewire ships
    # Alpine.js, which needs eval for x-data expressions without a deeper
    # nonce-based rework — but still locks default-src to self and blocks
    # framing/plugins, which is the actual clickjacking/XSS-object risk.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Do not leak the node/subscribe secrets into access logs (query strings
    # carry ?token= / ?secret= on the UniProxy + onip-callback endpoints).
    location ~ ^/(api/v1/server/UniProxy|api/callbacks/onip|subscribe) {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
